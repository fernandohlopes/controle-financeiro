<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testes — Controle Financeiro</title>
<style>
  body{font:14px/1.5 system-ui,sans-serif;background:#111;color:#ddd;margin:0;padding:20px}
  h1{font-size:18px;margin:0 0 4px}
  #resumo{font-weight:600;margin:0 0 14px}
  .ok{color:#4ade80}.falha{color:#f87171}
  li{margin:2px 0}
  iframe{width:390px;height:10px;border:0;opacity:0;position:absolute;left:-9999px}
</style>
</head>
<body>
<!-- Abre o app de verdade num quadro escondido e confere os cálculos que
     não podem quebrar: valores, parcelas, divisão, fatura, acerto e a
     leitura de frases do Lançar rápido. Rodado a cada publicação no GitHub
     (Actions) e também à mão: abra esta página no navegador. -->
<h1>Testes do Controle Financeiro</h1>
<div id="resumo">Rodando…</div>
<ul id="lista"></ul>
<iframe id="app" src="../index.html"></iframe>
<script>
const lista=document.getElementById('lista'), resumo=document.getElementById('resumo');
let ok=0, falhas=0;
function confere(nome, obtido, esperado){
  const igual=JSON.stringify(obtido)===JSON.stringify(esperado);
  const li=document.createElement('li');
  li.className=igual?'ok':'falha';
  li.textContent=(igual?'✓ ':'✗ ')+nome+(igual?'':`  — obtido ${JSON.stringify(obtido)}, esperado ${JSON.stringify(esperado)}`);
  lista.appendChild(li);
  igual?ok++:falhas++;
}
document.getElementById('app').addEventListener('load',()=>{
  const w=document.getElementById('app').contentWindow;
  // eval no próprio app: enxerga as variáveis dele (S, pessoaPrincipal…)
  const no=codigo=>w.eval(codigo);
  try{
    no(`
      S.pessoas=[{id:'1',nome:'Fernando Lopes'},{id:'2',nome:'Cindhy Medeiros'},{id:'3',nome:'Cintia Muniz'}];
      S.categorias=['Supermercados','Saúde','Contas da casa','Lanches','Eletrônicos','Aplicativo 99'].map((n,i)=>({id:'c'+i,nome:n}));
      S.cartoes=[{id:'k1',nome:'Nubank',fechamento:'3',vencimento:'10'},{id:'k2',nome:'Hipercard',fechamento:'25',vencimento:'5'},{id:'k3',nome:'Mercado Pago'}];
      S.lancamentos=[{id:'h1',desc:'Panvel',mesChave:'2026-10',valor:30,responsavel:'Fernando Lopes',cartao:'Mercado Pago',categoria:'Saúde',parcelas:1,parcelaAtual:1,grupoId:'h1',pago:true}];
      S.receitas={}; S.acertos=[]; pessoaPrincipal='Fernando Lopes'; SESSAO=null; outbox=[];
    `);

    // valores digitados
    confere('parseValor "1.234,56"', no('parseValor("1.234,56")'), 1234.56);
    confere('parseValor "89,9"', no('parseValor("89,9")'), 89.9);
    confere('parseValor "R$ 12"', no('parseValor("R$ 12")'), 12);
    confere('parseValor "23.50"', no('parseValor("23.50")'), 23.5);
    confere('parseValor inválido', no('isNaN(parseValor("abc"))'), true);

    // divisão em centavos, sem sobra
    confere('100 em 3', no('dividirValor(100,3)'), [33.34,33.33,33.33]);
    confere('2899 em 10 soma certo', no('Math.round(dividirValor(2899,10).reduce((s,v)=>s+v,0)*100)/100'), 2899);
    confere('1103,88 em 2', no('dividirValor(1103.88,2)'), [551.94,551.94]);

    // meses
    confere('chaveDesloc dez→jan', no('chaveDesloc("2026-12",1)'), '2027-01');
    confere('chaveDesloc 15 meses', no('chaveDesloc("2026-11",15)'), '2028-02');

    // fatura pelo fechamento
    const fat=(c,d)=>no(`(()=>{const f=faturaDoCartao('${c}',new Date('${d}T12:00'));return f?f.mes+'/'+f.ano:null})()`);
    // o mês da fatura é o MÊS DAS COMPRAS (Nubank fecha 3, vence 10)
    confere('Nubank compra 02/11 → out (fecha 03/11)', fat('Nubank','2026-11-02'), '10/2026');
    confere('Nubank compra no dia do fechamento → nov', fat('Nubank','2026-11-03'), '11/2026');
    confere('Nubank compra 05/11 → nov', fat('Nubank','2026-11-05'), '11/2026');
    confere('Hipercard compra 20/11 → nov', fat('Hipercard','2026-11-20'), '11/2026');
    confere('Hipercard compra 26/11 → dez', fat('Hipercard','2026-11-26'), '12/2026');
    confere('Hipercard compra 26/12 → jan', fat('Hipercard','2026-12-26'), '1/2027');
    const fv=(c,k)=>no(`(()=>{const v=vencimentoDoMes('${c}','${k}');return v?[v.fecha?fmtDia(v.fecha):null,fmtDia(v.vence)]:null})()`);
    confere('fatura Nubank de nov: fecha 03/12, vence 10/12', fv('Nubank','2026-11'), ['03/12','10/12']);
    confere('fatura Hipercard de nov: fecha 25/11, vence 05/12', fv('Hipercard','2026-11'), ['25/11','05/12']);
    confere('vencimento 08/12 do Nubank → fatura de nov', no(`mesPeloVencimento('Nubank',new Date(2026,11,8))`), '2026-11');
    confere('vencimento sem cartão cadastrado → mês anterior', no(`mesPeloVencimento('Mercado Pago',new Date(2026,11,8))`), '2026-11');
    confere('cartão sem fechamento', fat('Mercado Pago','2026-11-20'), null);

    // Lançar rápido
    const frase=t=>no(`(()=>{const r=interpretarFrase(${JSON.stringify(t)});return [r.desc,r.valor,r.parcelas,r.tipo,r.categoria,r.cartao,r.divisao?r.divisao.join('+'):r.responsavel,r.fixa]})()`);
    confere('frase simples', frase('mercado 89,90 nubank').slice(0,6), ['Mercado',89.9,1,'total','Supermercados','Nubank']);
    confere('frase parcelada', frase('tv 2899 em 10x hipercard').slice(1,6), [2899,10,'total','Eletrônicos','Hipercard']);
    confere('frase valor da parcela', frase('tv 10x de 289,90 hipercard').slice(1,4), [289.9,10,'parcela']);
    confere('frase dividida', frase('pizza 120 dividido com cindhy')[6], 'Fernando Lopes+Cindhy Medeiros');
    confere('frase dividida entre', frase('sushi 87 dividido entre cindhy e cintia')[6], 'Cindhy Medeiros+Cintia Muniz');
    confere('frase pra alguém', frase('farmácia 32 pra cintia')[6], 'Cintia Muniz');
    confere('frase fixa', frase('netflix 44,90 todo mês')[7], true);
    confere('frase usa histórico', frase('panvel 45').slice(4,6), ['Saúde','Mercado Pago']);
    confere('frase número na descrição', frase('uber 99 23,50').slice(0,2), ['Uber 99',23.5]);
    confere('frase sem categoria pede', no('interpretarFrase("presente 150").faltando'), ['categoria']);

    // painel: agregado e acerto
    no(`
      const h='2026-11';
      const L=(id,d,v,p,c,cat,pago)=>({id,desc:d,mesChave:h,valor:v,responsavel:p,cartao:c,categoria:cat,parcelas:1,parcelaAtual:1,grupoId:id,pago:!!pago});
      S.lancamentos=[L('a','Aluguel (Div.)',551.94,'Fernando Lopes','Sem cartão','Contas da casa'),L('b','Aluguel (Div.)',551.94,'Cindhy Medeiros','Sem cartão','Contas da casa'),
        L('c','Pizza (Div.)',60,'Cindhy Medeiros','Nubank','Lanches',true),L('d','Mercado',300,'Fernando Lopes','Nubank','Supermercados',true)];
      S.receitas={'2026-11':6400};
    `);
    confere('agregado total', no('Math.round(agregado("2026-11").total*100)/100'), 1463.88);
    confere('agregado meu', no('Math.round(agregado("2026-11").meu*100)/100'), 851.94);
    confere('saldo = receita − meus gastos', no('Math.round(agregado("2026-11").saldo*100)/100'), 5548.06);
    confere('agregado só da Cindhy', no('Math.round(agregado("2026-11","Cindhy Medeiros").total*100)/100'), 611.94);
    confere('acerto da Cindhy', no('acertosDoMes("2026-11").map(a=>[a.pessoa,a.total])'), [['Cindhy Medeiros',611.94]]);

    // acerto: saldo que passa de um mês para o outro
    no(`S.lancamentos.push({id:'dz',desc:'Uber',mesChave:'2026-12',valor:100,responsavel:'Cindhy Medeiros',cartao:'Nubank',categoria:'Lanches',parcelas:1,parcelaAtual:1,grupoId:'dz',pago:false});`);
    const conta=(m)=>no(`(()=>{const c=contaPessoa('Cindhy Medeiros','${m}');return [c.anterior,c.devido,c.recebido,c.falta]})()`);
    no(`S.acertos=[]`);
    confere('sem pagamento: novembro inteiro vai para dezembro', conta('2026-12'), [611.94,711.94,0,711.94]);
    no(`S.acertos=[{mes:'2026-11',pessoa:'Cindhy Medeiros',valor:300}]`);
    confere('pagou parte em novembro: falta', conta('2026-11'), [0,611.94,300,311.94]);
    confere('o que faltou entra em dezembro', conta('2026-12'), [311.94,411.94,0,411.94]);
    no(`S.acertos=[{mes:'2026-11',pessoa:'Cindhy Medeiros',valor:700}]`);
    confere('pagou a mais: vira crédito', conta('2026-12'), [-88.06,11.94,0,11.94]);
    no(`S.acertos=[{mes:'2026-11',pessoa:'Cindhy Medeiros',valor:611.94}]`);
    confere('quitou novembro: dezembro sem saldo', conta('2026-12'), [0,100,0,100]);
    no(`S.acertos=[{mes:'2026-11',pessoa:'Cindhy Medeiros',valor:300,perdoado:311.94}]`);
    confere('não cobrar: novembro encerrado', conta('2026-11'), [0,611.94,300,0]);
    confere('não cobrar: nada passa para dezembro', conta('2026-12'), [0,100,0,100]);
    no(`S.acertos=[]`);

    // fatura paga só em parte: o resto vai para a próxima fatura
    no(`
      S.lancamentos.push({id:'f1',desc:'Mercado',mesChave:'2026-11',valor:100,responsavel:'Fernando Lopes',cartao:'Nubank',categoria:'Supermercados',parcelas:1,parcelaAtual:1,grupoId:'f1',pago:false},
                         {id:'f2',desc:'Farmácia',mesChave:'2026-11',valor:50,responsavel:'Fernando Lopes',cartao:'Nubank',categoria:'Saúde',parcelas:1,parcelaAtual:1,grupoId:'f2',pago:false});
      outbox=[]; window.confirm=()=>true;
      pagarGrupo('f1,f2','Fatura Nubank',true,'cartao');
      $('pag-valor').value='120,00'; confirmarPagamento(true);
    `);
    confere('parcial: itens da fatura ficam pagos', no(`['f1','f2'].map(id=>S.lancamentos.find(l=>l.id===id).pago)`), [true,true]);
    confere('parcial: restante na fatura seguinte', no(`S.lancamentos.filter(l=>l.grupoId==='SALDO-f1').map(l=>[l.mesChave,l.valor,l.cartao])`), [['2026-12',30,'Nubank']]);
    no(`pagarGrupo('f1,f2','Fatura Nubank',false,'cartao')`);
    confere('desfazer: volta a pendente e some o restante', no(`[S.lancamentos.find(l=>l.id==='f1').pago,S.lancamentos.filter(l=>l.grupoId==='SALDO-f1').length]`), [false,0]);

    // importar fatura: não duplica, corrige valor, pergunta na dúvida
    no(`
      S.lancamentos=S.lancamentos.filter(l=>!['f1','f2'].includes(l.id));
      S.lancamentos.push(
        {id:'m8',desc:'Mesa e sofá',mesChave:'2026-12',valor:1001.79,responsavel:'Cintia Muniz',cartao:'Hipercard',categoria:'Eletrônicos',parcelas:10,parcelaAtual:8,grupoId:'ms',pago:false},
        {id:'m9',desc:'Mesa e sofá',mesChave:'2027-01',valor:1001.79,responsavel:'Cintia Muniz',cartao:'Hipercard',categoria:'Eletrônicos',parcelas:10,parcelaAtual:9,grupoId:'ms',pago:false},
        {id:'n1',desc:'Netflix',mesChave:'2026-12',valor:44.9,responsavel:'Fernando Lopes',cartao:'Hipercard',categoria:'Eletrônicos',parcelas:1,parcelaAtual:1,grupoId:'n1',pago:false},
        {id:'p1',desc:'Pizza (Div.)',mesChave:'2026-12',valor:60,responsavel:'Fernando Lopes',cartao:'Hipercard',categoria:'Lanches',parcelas:1,parcelaAtual:1,grupoId:'pz-1',pago:false},
        {id:'p2',desc:'Pizza (Div.)',mesChave:'2026-12',valor:60,responsavel:'Cindhy Medeiros',cartao:'Hipercard',categoria:'Lanches',parcelas:1,parcelaAtual:1,grupoId:'pz-2',pago:false});
      window.__imp=lerImportacao([
        '#FATURA Hipercard 2026-12',
        'MESA E SOFA LTDA | 1001,79 | Eletrônicos | Cintia | 08/10',
        'Netflix.com | 46,90 | Eletrônicos | Fernando',
        'Pizzaria Bella | 120,00 | Lanches | Fernando+Cindhy',
        'Restaurante Sul | 120,00 | Lanches | Fernando',
        'Drogaria Raia | 35,00 | Saúde | Fernando',
        'TV Samsung | 289,90 | Eletrônicos | Fernando | 03/10',
        '# estorno: Uber -12,00'
      ].join('\\n'));
    `);
    confere('importar: status de cada linha', no(`__imp.itens.map(i=>i.status)`), ['igual','corrigir','igual','novo','novo','novo']);
    confere('importar: correção mostra o valor antigo', no(`__imp.itens[1].alvo.total`), 44.9);
    confere('importar: sem avisos', no(`__imp.avisos`), []);
    no(`outbox=[];salvarImportacao.call(null);importacao=__imp;salvarImportacao();`);
    confere('importar: Netflix corrigido', no(`S.lancamentos.find(l=>l.id==='n1').valor`), 46.9);
    confere('importar: parcelado novo cria da 3ª à 10ª', no(`S.lancamentos.filter(l=>l.desc==='TV Samsung').map(l=>l.parcelaAtual+':'+l.mesChave)`),
      ['3:2026-12','4:2027-01','5:2027-02','6:2027-03','7:2027-04','8:2027-05','9:2027-06','10:2027-07']);
    confere('importar: mesa e sofá não duplicou', no(`S.lancamentos.filter(l=>l.grupoId==='ms').length`), 2);
    confere('importar: segunda vez é tudo "já lançado"', no(`lerImportacao(['#FATURA Hipercard 2026-12','Netflix.com | 46,90 | Eletrônicos | Fernando','Drogaria Raia | 35,00 | Saúde | Fernando'].join('\\n')).itens.map(i=>i.status)`), ['igual','igual']);
    confere('importar: mesmo valor, nome diferente = dúvida', no(`lerImportacao('#FATURA Hipercard 2026-12\\nPAG*XYZ | 35,00 | Saúde').itens[0].status`), 'duvida');
    confere('importar: fatura inteira, mesmo nome e outro valor = corrigir', no(`lerImportacao('#FATURA Hipercard 2026-12\\nDrogaria Raia | 50,00 | Saúde').itens[0].status`), 'corrigir');
    confere('importar: só os últimos, mesmo nome e outro valor = nova compra', no(`(()=>{const i=lerImportacao('#FATURA Hipercard 2026-12\\nDrogaria Raia | 50,00 | Saúde',true).itens[0];return [i.status,i.parecido&&i.parecido.desc]})()`), ['novo','Drogaria Raia']);
    confere('importar: só os últimos, o que já está lançado igual fica de fora', no(`lerImportacao('#FATURA Hipercard 2026-12\\nDrogaria Raia | 35,00 | Saúde\\nPosto Shell | 123,47 | Saúde',true).itens.map(i=>i.status)`), ['igual','novo']);
    confere('importar: "#FATURA ... ULTIMOS" liga o modo sozinho', no(`(()=>{const r=lerImportacao('#FATURA Hipercard 2026-12 ULTIMOS\\nDrogaria Raia | 50,00 | Saúde');return [r.parcialNoTexto,r.itens[0].status]})()`), [true,'novo']);
    no(`S.lancamentos.push(
      {id:'sp1',desc:'Spotify',mesChave:'2027-01',valor:20.45,responsavel:'Fernando Lopes',cartao:'Hipercard',categoria:'Lanches',parcelas:1,parcelaAtual:1,grupoId:'sp1',pago:false},
      {id:'sp2',desc:'Spotify',mesChave:'2027-01',valor:20.45,responsavel:'Cintia Muniz',cartao:'Hipercard',categoria:'Lanches',parcelas:1,parcelaAtual:1,grupoId:'sp2',pago:false},
      {id:'bo1',desc:'Boné',mesChave:'2027-01',valor:11.65,responsavel:'Cindhy Medeiros',cartao:'Hipercard',categoria:'Lanches',parcelas:12,parcelaAtual:12,grupoId:'bo',pago:false},
      {id:'pf1',desc:'Perfume',mesChave:'2027-01',valor:24.99,responsavel:'Cindhy Medeiros',cartao:'Hipercard',categoria:'Lanches',parcelas:12,parcelaAtual:12,grupoId:'pf',pago:false});`);
    confere('importar: soma de lançamentos com o mesmo nome = já lançado', no(`lerImportacao('#FATURA Hipercard 2027-01\\nEBW*Spotify | 40,90 | Lanches').itens[0].status`), 'igual');
    confere('importar: mesma parcela e valor, outro nome = já lançado', no(`(()=>{const i=lerImportacao('#FATURA Hipercard 2027-01\\nBah Free Shop | 11,65 | Lanches | Cindhy | 12/12').itens[0];return [i.status,i.alvo.desc]})()`), ['igual','Boné']);
    no(`for(let k=1;k<=12;k++)S.lancamentos.push({id:'fo'+k,desc:'Fone',mesChave:chaveDesloc('2026-11',k-3),valor:29.88,responsavel:'Cintia Muniz',cartao:'Hipercard',categoria:'Eletrônicos',parcelas:12,parcelaAtual:k,grupoId:'fo',pago:false});
      window.__fo=lerImportacao('#FATURA Hipercard 2026-11\\nCarrefour Com | 29,88 | Supermercados | Fernando | 03/10');`);
    confere('importar: parcela com outro total = dúvida que acerta o total', no(`[__fo.itens[0].status,__fo.itens[0].alvo.desc,__fo.itens[0].ajustaN]`), ['duvida','Fone',true]);
    no(`outbox=[];importacao=__fo;salvarImportacao();`);
    confere('importar: "é o mesmo" deixa a compra com 10 parcelas', no(`S.lancamentos.filter(l=>l.grupoId==='fo').map(l=>l.parcelaAtual+'/'+l.parcelas).join(' ')`), '1/10 2/10 3/10 4/10 5/10 6/10 7/10 8/10 9/10 10/10');
    // mudar a categoria de uma linha não volta a lista para o topo
    no(`mudarPagina('lancar');$('imp-box').open=true;
      $('imp-texto').value=['#FATURA Hipercard 2027-03',...Array.from({length:30},(_,k)=>'Loja '+k+' | '+(10+k)+',00 | | Fernando')].join(String.fromCharCode(10));
      lerImportacaoUI();`);
    const rolagem=no(`(()=>{const app=$('app'),disp=app.style.display;app.style.display='block';frameElement.style.height='800px';
      const l=document.querySelector('.imp-lista');l.scrollTop=300;const antes=l.scrollTop;
      const sel=document.querySelectorAll('.imp-cat')[20];sel.value=sel.options[1].value;sel.dispatchEvent(new Event('change',{bubbles:true}));
      const depois=document.querySelector('.imp-lista').scrollTop;app.style.display=disp;frameElement.style.height='';
      return antes>0&&depois===antes})()`);
    confere('importar: editar uma linha mantém a rolagem da lista', rolagem, true);
    no(`$('imp-texto').value='';lerImportacaoUI();mudarPagina('resumo');`);

    // CSV da fatura do Nubank
    no(`
      S.lancamentos.push({id:'hc',desc:'Academia Fit',mesChave:'2026-10',valor:119.9,responsavel:'Cintia Muniz',cartao:'Nubank',categoria:'Saúde',parcelas:1,parcelaAtual:1,grupoId:'hc',pago:true});
      window.__csv=csvParaLista([
        'date,title,amount',
        '2026-11-05,Academia Fit,119.90',
        '2026-11-06,"Mesa e Sofa - Parcela 8/10",1001.79',
        '2026-11-07,Pagamento recebido,-2000.00',
        '2026-11-08,Mercado Assai,389.90',
        '2026-11-09,Estorno Uber,-12.00'
      ].join('\\n'),'Nubank_2026-12-08.csv');
    `);
    confere('csv: cabeçalho com cartão e mês das compras', no(`__csv.texto.split('\\n')[0]`), '#FATURA Nubank 2026-11');
    confere('csv: compras e estornos/pagamentos de fora', no(`[__csv.qtd,__csv.fora]`), [3,2]);
    confere('csv: pessoa e categoria pelo histórico', no(`__csv.texto.split('\\n')[1]`), 'Academia Fit | 119,90 | Saúde | Cintia');
    confere('csv: parcela separada da descrição (histórico: da Cintia)', no(`__csv.texto.split('\\n')[2]`), 'Mesa e Sofa | 1.001,79 | Eletrônicos | Cintia | 08/10');
    confere('csv: categoria por palavra-chave', no(`__csv.texto.split('\\n')[3]`), 'Mercado Assai | 389,90 | Supermercados | Fernando');
    confere('csv: lista lida pelo importador', no(`lerImportacao(__csv.texto).itens.map(i=>[i.desc,i.valor,i.pessoas.join('+'),i.parcelaAtual])`),
      [['Academia Fit',119.9,'Cintia Muniz',1],['Mesa e Sofa',1001.79,'Cintia Muniz',8],['Mercado Assai',389.9,'Fernando Lopes',1]]);
    confere('csv: separador ; e valor com vírgula', no(`csvParaLista('data;descrição;valor\\n05/11/2026;Padaria;12,50','fatura.csv').texto.split('\\n')[1]`), 'Padaria | 12,50 | Lanches | Fernando');

    // adiantar parcelas: as últimas saem dos meses seguintes e entram no mês pago
    no(`
      for(let k=1;k<=10;k++)S.lancamentos.push({id:'af'+k,desc:'Financiamento',mesChave:chaveDesloc('2026-11',k-1),valor:100,responsavel:'Fernando Lopes',cartao:'Sem cartão',categoria:'Contas da casa',parcelas:10,parcelaAtual:k,grupoId:'af',pago:false});
      outbox=[];
      const mk=(tag,id,v)=>{const e=document.createElement(tag);e.id=id;e.value=v;e.className='tmp-teste';if(tag==='select'){const o=document.createElement('option');o.value=v;e.appendChild(o);e.value=v;}document.body.appendChild(e);};
      mk('input','adi-qtd','3');mk('input','adi-valor','270,00');mk('select','adi-mes','2026-11');
      adiantarParcelas('af1');
      document.querySelectorAll('.tmp-teste').forEach(e=>e.remove());
    `);
    confere('adiantar: 3 últimas no mês pago, com desconto e pagas',
      no(`S.lancamentos.filter(l=>l.grupoId==='af'&&l.mesChave==='2026-11').map(l=>[l.parcelaAtual,l.valor,l.pago]).sort((a,b)=>a[0]-b[0])`),
      [[1,100,false],[8,90,true],[9,90,true],[10,90,true]]);
